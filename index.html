<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オリジナルカードバトル</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="game-header">
    <h1>オリジナルカードバトル</h1>
    <p id="turn-info">ゲームを準備しています...</p>
  </header>

  <main>
    <section class="player-status enemy-status" id="enemy-status-area">
      <h2>相手</h2>
      <p>ライフ：<span id="enemy-life">3000</span></p>
      <p>山札：<span id="enemy-deck-count">—</span>枚</p>
      <p class="hp-hint">前衛と後衛が空なら、ここをタップして直接攻撃！</p>
    </section>

    <section class="field-section enemy-field">
      <h2>相手の後衛（アイテム）</h2>
      <div id="enemy-back-area" class="card-area"></div>
      <h2>相手の前衛（キャラクター）</h2>
      <div id="enemy-front-area" class="card-area"></div>
    </section>

    <div class="field-divider">BATTLE FIELD</div>

    <section class="field-section">
      <h2>自分の前衛（キャラクター）</h2>
      <div id="player-front-area" class="card-area"></div>
      <h2>自分の後衛（アイテム）</h2>
      <div id="player-back-area" class="card-area"></div>
    </section>

    <section class="player-status">
      <h2>自分</h2>
      <p>ライフ：<span id="player-life">3000</span></p>
      <p>山札：<span id="player-deck-count">—</span>枚</p>
    </section>

    <section class="hand-section">
      <h2>手札</h2>
      <div id="hand-area" class="card-area"></div>
    </section>

    <section class="controls">
      <button id="end-turn-button">ターン終了</button>
      <button id="cancel-attack-button">攻撃選択をキャンセル</button>
    </section>

    <section class="message-section">
      <h2>ゲーム状況</h2>
      <p id="game-message">ゲームを開始します。</p>
    </section>

    <section class="log-section">
      <h2>バトルログ</h2>
      <ul id="battle-log"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
